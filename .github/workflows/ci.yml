name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Must stay before setup-node: its pnpm cache reads the binary from the PATH.
      # Upstream sends pnpm 11+ to pnpm/setup, which would also own the Node install.
      # Not yet: one established action is worth more here than one fewer step.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # The Postgres store is only real against Postgres: the row lock, the jsonb
  # round-trip and the transaction boundaries cannot be faked by the in-memory
  # store the checks job uses.
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brigue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brigue
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both this step and the test's own setup apply the migrations; doing it
      # here as well exercises the command a deploy actually runs.
      - run: pnpm --filter @brigue/server migrate
      - run: pnpm test

  # The image is what gets deployed: nothing else checks that the Dockerfile
  # builds, that Node runs the TypeScript it ships, or that the probes answer
  # through it. What runs the image (cluster manifests, database, migrations)
  # belongs to lesloi/brigue-k8s.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brigue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brigue
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag brigue:ci .
      - name: Migrate through the image
        run: |
          docker run --rm --network host --env DATABASE_URL brigue:ci node scripts/migrate.ts
          docker run --rm --network host --env DATABASE_URL brigue:ci node scripts/migrate.ts --check
      - name: Serve through the image
        run: |
          docker run --detach --name brigue --network host \
            --env DATABASE_URL --env PORT=3000 --env COOKIE_SECURE=false brigue:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'the image never became ready'
          exit 1
      - name: Answer with the client
        run: |
          index="$(curl --fail --silent http://127.0.0.1:3000/)"
          echo "$index" | grep --quiet '<title>Brigue</title>'
          asset="$(echo "$index" | grep --only-matching --extended-regexp 'src="/assets/[^"]+\.js"' | sed 's/^src="//;s/"$//')"
          test -n "$asset"
          curl --fail --silent --head "http://127.0.0.1:3000$asset" \
            | grep --quiet --ignore-case 'cache-control: public, max-age=31536000, immutable'
          curl --fail --silent http://127.0.0.1:3000/healthz | grep --quiet '"status":"ok"'
      - name: Show the server log
        if: always()
        run: docker logs brigue || true
