name: Image

# A pull request builds the image without pushing it. The image is the only thing this repository
# ships, so a Dockerfile that breaks must break here, not after the merge, on the release that was
# supposed to publish it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built and thrown away: no tag, no registry, no credentials.
      - uses: docker/build-push-action@v7
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
