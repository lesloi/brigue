name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time on main. A run waiting behind the running one is replaced by a newer push: only
# the latest commit is tested and published, and it contains the others.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks and tests run here on `main`, so that nothing is published before they pass. A called
  # workflow sees this workflow's name in `github.workflow`, so their concurrency groups carry their
  # own name to stay distinct from this one. The quick check goes first, so a failure does not leave
  # the long job running.
  check:
    uses: ./.github/workflows/check.yml
  tests:
    needs: check
    uses: ./.github/workflows/test.yml

  # Builds the multi-platform image and pushes it to GitHub Container Registry. It is the only
  # artifact this repository publishes: what runs it is not its business. The second platform is
  # emulated through QEMU and the Dockerfile installs twice per platform, so a cold run is slow.
  container:
    needs: [check, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
